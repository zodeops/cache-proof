name: gh-baseline
# The same 1 GB restores on GitHub-hosted runners with GitHub's own cache,
# for comparison with Zode's node cache. Dispatch twice: fill, then read.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  big:
    runs-on: ubuntu-latest
    steps:
      - run: date +%s.%N > /tmp/t0
      - id: rand
        uses: actions/cache/restore@v6.1.0
        with: { path: rand1g, key: gh-rand1g-v1 }
      - run: echo "rand hit=${{ steps.rand.outputs.cache-hit }} seconds=$(awk -v a=$(date +%s.%N) -v b=$(cat /tmp/t0) 'BEGIN{printf "%.2f", a-b}')"; date +%s.%N > /tmp/t0
      - id: dep
        uses: actions/cache/restore@v6.1.0
        with: { path: dep1g, key: gh-dep1g-v1 }
      - run: echo "dep hit=${{ steps.dep.outputs.cache-hit }} seconds=$(awk -v a=$(date +%s.%N) -v b=$(cat /tmp/t0) 'BEGIN{printf "%.2f", a-b}')"; du -sh rand1g dep1g 2>/dev/null || true
      - if: steps.rand.outputs.cache-hit != 'true'
        run: mkdir -p rand1g && head -c 1073741824 /dev/urandom > rand1g/rand
      - if: steps.dep.outputs.cache-hit != 'true'
        run: |
          i=0; while [ $i -lt 8192 ]; do d=dep1g/p$((i % 128)); mkdir -p $d
            if [ $((i % 8)) = 0 ]; then head -c 131072 /dev/urandom > $d/f$i.bin
            else seq $((i*1000)) $((i*1000+18000)) | sed "s/^/const v_/; s/$/ = require('module-$i');/" | head -c 131072 > $d/f$i.js || true; fi; i=$((i+1)); done
      - if: steps.rand.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with: { path: rand1g, key: gh-rand1g-v1 }
      - if: steps.dep.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with: { path: dep1g, key: gh-dep1g-v1 }
