name: cache
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  big:
    runs-on: zode-4x8
    steps:
      - name: Where the cache is
        run: |
          echo "ACTIONS_RESULTS_URL=$ACTIONS_RESULTS_URL ACTIONS_CACHE_SERVICE_V2=$ACTIONS_CACHE_SERVICE_V2"
          date +%s.%N > /tmp/t0
      - id: rand
        uses: actions/cache/restore@v6.1.0
        with:
          path: rand1g
          key: rand1g-v1
      - name: Restore time (1 GB, incompressible)
        run: |
          echo "hit=${{ steps.rand.outputs.cache-hit }} seconds=$(awk -v a=$(date +%s.%N) -v b=$(cat /tmp/t0) 'BEGIN{printf "%.2f", a-b}')"
          du -sh rand1g 2>/dev/null || true
          date +%s.%N > /tmp/t0
      - id: mixed
        uses: actions/cache/restore@v6.1.0
        with:
          path: mixed1g
          key: mixed1g-v1
      - name: Restore time (1 GB of files, mixed)
        run: |
          echo "hit=${{ steps.mixed.outputs.cache-hit }} seconds=$(awk -v a=$(date +%s.%N) -v b=$(cat /tmp/t0) 'BEGIN{printf "%.2f", a-b}')"
          du -sh mixed1g 2>/dev/null || true
          find mixed1g -type f 2>/dev/null | wc -l
      - name: Make 1 GB
        if: steps.rand.outputs.cache-hit != 'true' || steps.mixed.outputs.cache-hit != 'true'
        run: |
          mkdir -p rand1g mixed1g
          head -c 1073741824 /dev/urandom > rand1g/blob
          # 1 GB in 4,096 files: a quarter random, the rest text, like a dependency tree
          for i in $(seq 0 4095); do
            d=mixed1g/p$((i % 64)); mkdir -p $d
            if [ $((i % 4)) = 0 ]; then head -c 262144 /dev/urandom > $d/f$i.bin
            else head -c 196608 /dev/urandom | base64 -w 100 | head -c 262144 > $d/f$i.txt; fi
          done
          du -sh rand1g mixed1g
      - if: steps.rand.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: rand1g
          key: rand1g-v1
      - if: steps.mixed.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: mixed1g
          key: mixed1g-v1

  node:
    runs-on: zode
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: cd node && npm ci --no-audit --no-fund && ls node_modules | wc -l

  buildx:
    runs-on: zode-4x8
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: img
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  artifacts:
    runs-on: zode
    steps:
      - uses: actions/github-script@v9.0.0
        with:
          script: |
            core.info(`ACTIONS_RESULTS_URL=${process.env.ACTIONS_RESULTS_URL}`)
            core.info(`GitHub's own (renamed) ACTIONS_RESULTS_ORL=${process.env.ACTIONS_RESULTS_ORL}`)
      - run: mkdir out && date > out/stamp.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: stamp
          path: out
      - uses: actions/download-artifact@v8.0.2
        with:
          name: stamp
          path: back
      - run: cat back/stamp.txt

  scope:
    runs-on: zode
    steps:
      - name: Context
        run: echo "event=${{ github.event_name }} ref=${{ github.ref }} head=${{ github.event.pull_request.head.repo.full_name }}"
      - id: marker
        uses: actions/cache/restore@v6.1.0
        with:
          path: marker
          key: main-marker
      - name: Save main's marker (main only)
        if: github.ref == 'refs/heads/main' && steps.marker.outputs.cache-hit != 'true'
        run: mkdir -p marker && echo "from main" > marker/m
      - if: github.ref == 'refs/heads/main' && steps.marker.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: marker
          key: main-marker
      - name: A pull request reads main's entries
        if: github.event_name == 'pull_request'
        run: |
          echo "main-marker hit=${{ steps.marker.outputs.cache-hit }}"
          cat marker/m || true
      - name: Poison (pull requests)
        if: github.event_name == 'pull_request'
        run: mkdir -p poison && echo "from ${{ github.event.pull_request.head.repo.full_name }}" > poison/p
      - if: github.event_name == 'pull_request'
        uses: actions/cache/save@v6.1.0
        with:
          path: poison
          key: poison-${{ github.event.pull_request.head.repo.full_name == github.repository && 'same' || 'fork' }}
      - id: p
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/restore@v6.1.0
        with:
          path: poison
          key: poison-fork
          restore-keys: poison-
      - name: Main must not see a fork's save
        if: github.ref == 'refs/heads/main'
        run: |
          echo "poison hit=${{ steps.p.outputs.cache-hit }} matched=${{ steps.p.outputs.cache-matched-key }}"
          if [ -f poison/p ]; then cat poison/p; grep -q "/" poison/p && ! grep -q "${{ github.repository }}" poison/p && { echo "FORK ENTRY REACHED MAIN"; exit 1; }; fi
          echo "main reads no fork entry"
